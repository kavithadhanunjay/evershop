name: cicd pipeline

on: 
  push: 
    branches: ['feature/*']
  workflow_dispatch: 

env: 
  APP_NAME: test_app

jobs: 

  lint: 
    name: Lint Check
    runs-on: ubuntu-latest
    steps: 
       -  name: checkout code
          uses: actions/checkout@v4
       -  name: Setup Node
          uses: actions/setup-node@v4
          with: 
             node-version: 20
             cache: npm
       -  name: Install dependencies
          run: npm ci
       -  name: Run lint 

    build: 
      name: Build 
      runs-on: ubuntu-latest
      needs: lint

      steps: 
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with: 
            node-version: 20
            cache: npm
        - run: npm ci
        - run: npm run compile --if-present

    test: 
      name: Unit Tests
      runs-on: ubuntu-latest
      needs: build

      steps: 
        - uses: actions/checkout@v4
        
        - uses: actions/setup-node@v4
          
          with: 
            node-version: 20
            cache: npm
        - run: npm ci
        - run: npm test --if-present