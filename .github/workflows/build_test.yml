name: Optimized CI Pipeline

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

env:
  APP_NAME: test_app

jobs:

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2


  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile all packages
        run: npm run compile

      - name: Compile DB packages
        run: npm run compile:db

      - name: Save workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            .
            node_modules
            packages/**/dist


  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Relink node binaries
        run: npm install --prefer-offline --no-audit

      - run: npm run lint --if-present


  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Relink node binaries
        run: npm install --prefer-offline --no-audit

      - name: Run tests
        run: npm test -- --passWithNoTests


  package:
    name: Package Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-build
          path: .
