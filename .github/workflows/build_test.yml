name: cicd pipeline

on: 
  push: 
    branches: ['feature/*']
  workflow_dispatch: 

env: 
  APP_NAME: test_app

jobs: 

  lint: 
    name: Lint Check
    runs-on: ubuntu-latest
    needs: secret-scan
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present   # ← FIXED (added command)

  build: 
    name: Build 
    runs-on: ubuntu-latest
    needs: lint

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run compile --if-present

  test: 
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present -- --passWithNoTests
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
