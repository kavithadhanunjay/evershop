name: Optimized CI Pipeline

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

env:
  APP_NAME: test_app

jobs:

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2


  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run compile --if-present

      - name: Save workspace for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            .
            node_modules


  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Run lint
        run: npm run lint --if-present


  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Run tests
        run: npm test --if-present -- --passWithNoTests


  package:
    name: Package Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-build
          path: .
